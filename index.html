<style>
:root{
  --page:#ffffff; --fg:#16181b; --muted:#6b6f76;
  --blue:#1f7fd2; --blue-dk:#1a6cb4; --yellow:#ffd23f; --ink:#16181b;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--page);color:var(--fg);font-family:'IBM Plex Sans',system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;gap:28px}
.shelf{width:100%;display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;justify-content:center}

/* a booklet cover */
.book{position:relative;display:flex;flex-direction:column;width:min(360px,100%);aspect-ratio:210/280;
  background:var(--blue);border-radius:6px;overflow:hidden;color:#fff;text-decoration:none;
  box-shadow:6px 8px 0 #16181b, 0 18px 36px rgba(0,0,0,.18);
  transition:transform .15s ease, box-shadow .15s ease}
a.book:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:8px 12px 0 #16181b, 0 24px 40px rgba(0,0,0,.22)}
a.book:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0}
.mark{font-weight:700;font-size:18px;letter-spacing:-.01em}
.mark b{font-weight:700;color:var(--yellow)}
.art{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 26px 4px;min-height:0}
.art img{display:block;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 1px 0 rgba(0,0,0,.05))}
.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 16px 16px}
.num{width:46px;height:46px;flex:none;border-radius:50%;background:#fff;color:var(--blue);font-weight:700;font-size:26px;
  display:flex;align-items:center;justify-content:center}
.title{flex:1}
.title h2{margin:0;font-size:32px;line-height:1;font-weight:700;letter-spacing:-.02em}
.title p{margin:6px 0 0;font:500 12px/1.3 'IBM Plex Mono',monospace;color:rgba(255,255,255,.85);white-space:nowrap}

/* the next booklet: not written yet */
.book.later{width:min(220px,62vw);background:transparent;border:2px dashed #c4c7cc;box-shadow:none;color:var(--muted);
  align-items:center;justify-content:center;text-align:center;padding:16px;font-size:14px;line-height:1.4}
.book.later .num{background:#eceef1;color:var(--muted);margin-bottom:12px}

h1{margin:0;font-size:clamp(28px,6vw,44px);line-height:1.05;font-weight:700;letter-spacing:-.025em;text-align:center}
h1 b{color:var(--blue)}
footer{font-size:13px;color:var(--muted);text-align:center;max-width:520px;line-height:1.5}
footer kbd{font:500 12px 'IBM Plex Mono',monospace;border:1px solid #c4c7cc;border-radius:3px;padding:0 4px}
@media (max-width:520px){ body{padding:16px;gap:14px;min-height:100svh} .shelf{gap:14px}
  .book{width:min(100%, calc((100svh - 250px) * 210 / 280))}   /* the cover shrinks to fit the screen's height: nothing to scroll */
  .book.later{aspect-ratio:auto;width:100%;flex-direction:row;gap:12px;padding:10px} .book.later .num{margin:0;width:36px;height:36px;font-size:20px}
  footer .keys{display:none} }
</style>
