<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="3D step-by-step guide to fitting the gLOWCOST detector layers, readout box and cables into the finished frame.">
<title>gLOWCOST Detector Build</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the 3D bench fills the viewport. One panel top-left (counter, the instruction, the parts this step uses),
   one bar at the bottom: magnifier, restart / skip, back / next. */
:root{
  --bg:#2a2b2d; --fg:#ecebe7; --muted:#a6a8ad; --band:rgba(30,31,33,.92); --line:#4a4c50;
  --btn:#ecebe7; --btn-fg:#1c1d1f; --check:#f08a4b; --hold:#f08a4b;
  --t-s:12px; --t-m:14px; --t-l:17px; color-scheme:dark;   /* always dark, whatever the system setting: it stands out against the table */
  --font:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden}
#app{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#stepBox{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:max(16px,env(safe-area-inset-top,0px));width:clamp(260px,30vw,400px);box-sizing:border-box;
  background:var(--band);border:1px solid var(--line);border-radius:6px;padding:12px 14px 12px;display:grid;gap:10px;backdrop-filter:blur(4px)}
#counter{font-family:var(--mono);font-size:var(--t-s);letter-spacing:.06em;color:var(--muted);white-space:nowrap;display:flex;justify-content:space-between}
#counter b{color:var(--fg);font-weight:500}
#rep{color:var(--fg)}
#sentence{margin:0;font-size:var(--t-l);line-height:1.38;font-weight:500}
#note{margin:-2px 0 0;font-size:var(--t-m);line-height:1.42;color:var(--muted)}
#note[hidden]{display:none}
#sentence.check::before{content:"Check";font-family:var(--mono);font-size:var(--t-s);letter-spacing:.08em;text-transform:uppercase;color:var(--check);margin-right:8px}
#sentence .r{color:#c8382c}#sentence .b{color:#2b63c4}
#partsRow{display:flex;flex-wrap:wrap;gap:6px 16px;border-top:1px solid var(--line);padding-top:10px}
#partsRow[hidden]{display:none}
#partsRow .item{display:flex;align-items:center;gap:6px}
#partsRow img{width:60px;height:60px;display:block}
#partsRow .n{font-family:var(--mono);font-size:var(--t-l);font-weight:500;color:var(--fg)}
#bottom{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:6px;display:flex;justify-content:center;align-items:center;gap:6px;
  background:var(--band);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.14);backdrop-filter:blur(6px)}   /* a small dock, not a bar */
#bottom .mid{display:flex;gap:6px;justify-content:center;align-items:center}
#bottom button{border-color:transparent} #bottom button:not(:disabled):hover{border-color:var(--line)}
#stepBox .nav{display:flex;gap:8px}
#stepBox .nav #next{flex:1}
button{touch-action:manipulation;font:inherit;font-family:var(--mono);font-size:var(--t-s);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:transparent;color:var(--fg);padding:10px 16px;border-radius:4px;cursor:pointer;white-space:nowrap}
button:focus-visible{outline:2px solid var(--check);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
#next{background:var(--btn);color:var(--btn-fg);border-color:var(--btn);font-weight:500}
#next.wait{background:transparent;color:var(--check);border-color:var(--check)}
#back.onward{background:#1f7fd2;color:#fff;border-color:#1f7fd2;font-weight:600}   /* first step: back to the guide before, in its colour */
#next.onward{background:#f2c230;color:#1c1d1f;border-color:#f2c230;font-weight:600}   /* last step: on to the next guide, in its colour */
#back{min-width:84px}
.lbl{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-family:var(--mono);font-size:var(--t-s);letter-spacing:.05em;color:var(--fg);background:var(--band);padding:2px 6px;border-radius:3px;border:1px solid var(--line);white-space:nowrap}
.lbl.hold{color:var(--hold);border-color:var(--hold);font-weight:500}
.lbl.count{color:var(--check);border-color:var(--check);font-weight:500}
.lbl.tray{opacity:.85}
.lbl.fly{color:var(--fg);border-color:var(--fg);font-weight:500}
.lbl.dim{color:#f4d23c;background:#1c1d1f;border-color:#f4d23c;font-weight:500}
#magHint{position:absolute;pointer-events:none;display:flex;flex-direction:column;align-items:flex-start;animation:hintBob 1.6s ease-in-out infinite}
#magHint[hidden]{display:none}
#magHint span{font-family:var(--mono);font-size:var(--t-s);letter-spacing:.05em;color:#f4d23c;background:#1c1d1f;border:1px solid #f4d23c;border-radius:3px;padding:2px 6px;font-weight:500}
@keyframes hintBob{0%,100%{translate:0 0}50%{translate:0 -5px}}
@media (prefers-reduced-motion: reduce){ #magHint{animation:none} }
#keyHint{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);color:#fff;font-size:var(--t-m);letter-spacing:.02em;pointer-events:none;white-space:nowrap;background:rgba(20,21,23,.72);border-radius:999px;padding:6px 14px;backdrop-filter:blur(4px)}
#keyHint[hidden]{display:none}
#keyHint kbd{font-family:var(--mono);font-size:var(--t-s);border:1px solid rgba(255,255,255,.55);border-radius:4px;padding:1px 6px}
.lbl.deg{color:#fff;background:#d7262b;border-color:#d7262b;font-weight:500;padding:1px 5px}
#why{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:70px;max-width:340px;background:var(--band);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:var(--t-m);line-height:1.45;color:var(--fg)}
#why b{font-family:var(--mono);font-size:var(--t-s);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}
#why[hidden]{display:none}
#callout{position:absolute;width:250px;background:var(--band);border:1.5px solid #d7262b;border-radius:5px;padding:9px 11px 10px;display:grid;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#callout[hidden]{display:none}
#callout .prog{font-family:var(--mono);font-size:var(--t-s);letter-spacing:.08em;text-transform:uppercase;color:#d7262b}
#callout .q{font-size:var(--t-m);line-height:1.35;font-weight:500}
#callout .row{display:flex;gap:8px}
#callout .row button{flex:1;padding:7px 0}
#callout #cYes{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
#callout .msg{font-size:var(--t-m);line-height:1.4;color:var(--fg)}
#callout .msg button{margin-top:6px;padding:5px 10px}
#cam2{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:70px;border:2px solid #1c1d1f;border-radius:4px;pointer-events:none}
#cam2[hidden],#cam2b[hidden]{display:none}
#cam2b{position:absolute;bottom:70px;border:2px solid #1c1d1f;border-radius:4px;pointer-events:none}
#cam2 .badge,#cam2b .badge{position:absolute;left:8px;top:8px;width:30px;height:30px;padding:0;border-radius:6px;display:grid;place-items:center}
#cam2 .badge.ok{background:#1f9d55} #cam2b .badge.no{background:#d7262b}
.badge svg{width:20px;height:20px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
#cam2 span{position:absolute;left:0;top:0;background:#1c1d1f;color:#f6f4f0;font-family:var(--mono);font-size:var(--t-s);letter-spacing:.06em;padding:3px 7px;text-transform:uppercase}
/* magnifier: the same object as the one on the tray, a steel ring on a wooden handle */
#magBtn{width:40px;height:40px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--band)}
#magBtn svg{width:30px;height:30px;display:block}
#magBtn.on{background:var(--btn);border-color:var(--btn)}
#home{position:absolute;top:max(18px,env(safe-area-inset-top,0px));right:max(20px,env(safe-area-inset-right,0px));z-index:5;color:#fff;opacity:.9;font-size:14px;font-weight:500;text-decoration:none;text-shadow:0 1px 2px rgba(0,0,0,.25)}
#home:hover{opacity:1;text-decoration:underline;text-underline-offset:3px}
@media (max-width:760px){ #bottom .long{display:none} #why{display:none} }
.ico{display:none}
/* phone, upright: the instructions become a sheet along the bottom, within thumb reach, with every control in it.
   Cam 2 and the right/wrong pictures sit at the top; the build is framed in between. Nothing scrolls. */
body.phone #bottom{display:none}
body.phone #stepBox{left:0;right:0;top:auto;bottom:0;width:auto;border-radius:14px 14px 0 0;border-width:1px 0 0;padding:10px 14px max(12px,env(safe-area-inset-bottom,0px));gap:8px}
body.phone #sentence{font-size:16px;line-height:1.32}
body.phone #note{font-size:13px;line-height:1.38}
body.phone #partsRow{padding-top:8px;gap:4px 14px}
body.phone #partsRow img{width:40px;height:40px}
body.phone #partsRow .n{font-size:15px}
body.phone #stepBox .nav{align-items:center;gap:6px}
body.phone #stepBox .nav .mid{display:flex;gap:6px}
body.phone #stepBox .nav .mid button{width:40px;height:40px;padding:0;display:grid;place-items:center;border-color:var(--line)}
body.phone #stepBox .txt{display:none}
body.phone #stepBox .ico{display:block;width:18px;height:18px}
body.phone #back .ico,body.phone #next .ico{width:22px;height:22px}
body.phone #next{display:grid;place-items:center}
body.phone #back{min-width:0;width:44px;padding:0;height:40px;display:grid;place-items:center}
body.phone #next{height:40px}
body.phone #keyHint,body.phone #magHint{display:none!important}
body.phone #magBtn.hint{border-color:#f4d23c;box-shadow:0 0 0 2px #f4d23c;animation:magPulse 1.4s ease-in-out infinite}
@keyframes magPulse{0%,100%{box-shadow:0 0 0 2px #f4d23c}50%{box-shadow:0 0 0 6px rgba(244,210,60,.25)}}
body.phone #home{top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
/* phone on its side, or any short window: the same layout as a desktop, tighter */
@media (max-height:500px){ #stepBox{padding:8px 10px;gap:6px;top:max(10px,env(safe-area-inset-top,0px))} #sentence{font-size:15px;line-height:1.3} #note{font-size:12.5px;line-height:1.35}
  #partsRow{padding-top:6px} #partsRow img{width:34px;height:34px} #partsRow .n{font-size:14px} button{padding:7px 12px} #back{min-width:64px}
  #bottom{padding:4px;bottom:max(8px,env(safe-area-inset-bottom,0px))} #magBtn{width:34px;height:34px} #magBtn svg{width:24px;height:24px} #keyHint{bottom:58px} }
@media (max-width:520px){ #bottom .mid{gap:6px} #bottom button{padding:10px 10px} #magBtn{width:40px;height:40px;padding:0} }
@media (prefers-reduced-motion: reduce){ :root{--motion:0} }
/* last step: other people's detectors, and where to send a photo of yours */
#gallery{position:absolute;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;padding:10px;background:var(--band);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(4px);z-index:5;cursor:default;user-select:none}
#gallery[hidden]{display:none}
#gallery .head{font-family:var(--mono);font-size:var(--t-s);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gallery .wall{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#gallery .wall div{border-radius:3px;overflow:hidden;background:#1c1d1f;position:relative;aspect-ratio:1}
#gallery .wall div.wide{grid-column:1 / span 2;aspect-ratio:16/9}
#gallery .wall img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity .6s;pointer-events:none;-webkit-user-drag:none}
#gallery .send{margin:0;font-size:var(--t-m);line-height:1.4;color:var(--fg);user-select:text}   /* the address can be selected and copied */
#gallery .send b{color:#f2c230;font-weight:600}
body.phone #gallery{padding:8px;gap:6px}
body.phone #gallery .wall{grid-template-columns:16fr 9fr 9fr}
body.phone #gallery .wall div.wide{grid-column:auto}
body.phone #gallery .send{font-size:12.5px;line-height:1.3}
</style>

<div id="app">

    <div class="mid"><button id="restart" aria-label="Restart animation"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4v4.6h4.6"/></svg><span class="txt">Restart<span class="long"> animation</span></span></button><button id="skip" aria-label="Skip animation"><svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6l7.5 6L3 18z"/><path d="M11 6l7.5 6L11 18z"/><rect x="18.6" y="6" width="2.2" height="12" rx=".6"/></svg><span class="txt">Skip<span class="long"> animation</span></span></button>
      <button id="magBtn" title="Magnifier" aria-label="Magnifier"><svg viewBox="0 0 32 32"><circle cx="13" cy="13" r="8.5" fill="rgba(207,230,245,.25)" stroke="#b9bec4" stroke-width="3"/><path d="M19.2 19.2 L21.4 21.4" stroke="#b9bec4" stroke-width="2.6"/><path d="M21.6 21.6 L28.4 28.4" stroke="#8a5a3c" stroke-width="4.4" stroke-linecap="round"/></svg></button>
    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
/* ============================== scene ============================== */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'low-power'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 3));
app.prepend(renderer.domElement);
const scene = new THREE.Scene();
const css = getComputedStyle(document.documentElement);
scene.background = new THREE.Color(0xf2c230);   // booklet 2: yellow
const camera = new THREE.PerspectiveCamera(42, 1, 1, 1000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a847a, 0.72));
const sun = new THREE.DirectionalLight(0xffffff, 0.62); sun.position.set(30, 90, 70); scene.add(sun);

const M = {
  alu:  new THREE.MeshStandardMaterial({color:0xa7abb0, roughness:.5, metalness:.15}),
  dark: new THREE.MeshStandardMaterial({color:0x6e7277, roughness:.6, metalness:.2}),
  nut:  new THREE.MeshStandardMaterial({color:0xc19a45, roughness:.5, metalness:.3}),
  screw:new THREE.MeshStandardMaterial({color:0x303234, roughness:.55, metalness:.3}),
  rubber:new THREE.MeshStandardMaterial({color:0x222222, roughness:.95}),
  red:  new THREE.MeshStandardMaterial({color:0xc8382c, roughness:.7}),
  blue: new THREE.MeshStandardMaterial({color:0x2b63c4, roughness:.7}),
  table:new THREE.MeshStandardMaterial({color:0xb3a58d, roughness:.9}),
  tray: new THREE.MeshStandardMaterial({color:0xd4d2cb, roughness:.85}),
  trayIn:new THREE.MeshStandardMaterial({color:0xc3c1b9, roughness:.9}),
  chair:new THREE.MeshStandardMaterial({color:0x8f8a82, roughness:.9}),
  ghost:new THREE.MeshBasicMaterial({color:0xb8470c, transparent:true, opacity:.28, depthWrite:false}),
  steel:new THREE.MeshStandardMaterial({color:0x5c6166, roughness:.45, metalness:.5}),
  clear:new THREE.MeshStandardMaterial({color:0xdfe9f2, roughness:.2, metalness:.05, transparent:true, opacity:.35, depthWrite:false}),
  glass:new THREE.MeshStandardMaterial({color:0xcfe6f5, roughness:.1, transparent:true, opacity:.25, depthWrite:false}),
  wood:new THREE.MeshStandardMaterial({color:0x8a5a3c, roughness:.8}),
};

/* ============================== geometry ============================== */
const POST_L = 30.9, RAIL_L = 20.32, HALF = 11.16;           // cm
const LEVEL_Y = [30.5, 17.5, 4.5];                             // rail centre heights, upright, feet included
const NUT_H = [27.75, 14.75, 6.05];                            // post-nut heights from the foot end (in line with the bracket holes)
const NUT_D = 0.715;                                             // nut centre depth from the extrusion axis (under the 1.8 mm lips)
const HOLE = 1.15;                                              // bracket hole centre, from the bracket's outer corner
function profileShape(){
  // 20x20 mm, slot opening 6.2 mm, lip 1.8 mm, cavity 11.2 mm wide under the lips, webs 1.6 mm, core 7.6 mm with a 4.2 mm bore
  const h=1, o=0.31, lipIn=0.82, cav=0.56, wo=0.11, rc=0.38;
  // web edge on the +x cavity side: y = -(x - wo) for the lower web; meets the core circle at:
  const xc=(wo+Math.sqrt(wo*wo-2*(wo*wo-rc*rc)))/2, yc=-(xc-wo);
  const a0=Math.atan2(yc,xc);
  const face=[[h,-h],[h,-o],[lipIn,-o],[lipIn,-cav],[cav+wo,-cav]];
  for (let k=0;k<=8;k++){ const a=a0+(-2*a0)*k/8; face.push([rc*Math.cos(a), rc*Math.sin(a)]); }
  face.push([cav+wo,cav],[lipIn,cav],[lipIn,o],[h,o]);
  const pts=[];
  for(let k=0;k<4;k++){ const a=k*Math.PI/2, c=Math.cos(a), s=Math.sin(a); for(const [x,y] of face) pts.push(new THREE.Vector2(x*c-y*s, x*s+y*c)); }
  const sh=new THREE.Shape(pts); sh.holes.push(new THREE.Path().absarc(0,0,0.21,0,Math.PI*2,true));
  return sh;
}
const PROFILE = profileShape();
function extrusion(len){ return new THREE.ExtrudeGeometry(PROFILE, {depth:len, bevelEnabled:false, steps:1}); }
// T-nut: a flat plate pressed up under the lips (its face toward the slot opening), and the stem of the T pointing down into the beam. 10 mm long.
const TNUT_SHAPE=new THREE.Shape([[0.10,-0.47],[0.10,0.47],[-0.02,0.47],[-0.02,0.2],[-0.20,0.2],[-0.20,-0.2],[-0.02,-0.2],[-0.02,-0.47]].map(([u,v])=>new THREE.Vector2(u,v)));
function tnut(out, along){ // shape in (out, across), extruded along the groove; 'out' points to the slot opening
  const u=new THREE.Vector3(...out), w=new THREE.Vector3(...along), v=new THREE.Vector3().crossVectors(w,u);
  const g=new THREE.ExtrudeGeometry(TNUT_SHAPE,{depth:1.0,bevelEnabled:false}).translate(0,0,-0.5);
  g.applyMatrix4(new THREE.Matrix4().makeBasis(u,v,w)); g.userData={out:u.clone()}; return g; }
const G = {
  post: extrusion(POST_L).rotateX(-Math.PI/2),                 // along +y, foot at y=0
  rail: extrusion(RAIL_L).rotateY(Math.PI/2).translate(-RAIL_L/2,0,0), // along x, centred
  nutX: tnut([1,0,0],[0,1,0]),                                // post groove on the +x face (groove runs along y)
  nutYp:tnut([0,1,0],[1,0,0]),                                // rail groove on the +y face (groove runs along x)
  nutYn:tnut([0,-1,0],[1,0,0]),                               // rail groove on the -y face
  nutZ: tnut([0,0,1],[0,1,0]),                                // post groove on the +z face
  nutZr:tnut([0,0,1],[1,0,0]),                                // rail groove on the +z face
  foot: new THREE.LatheGeometry([[0.22,0.775],[0.22,0.225],[0.42,0.225],[0.42,-0.775],[0.78,-0.775],[1.0,0.775],[0.22,0.775]].map(([r,y])=>new THREE.Vector2(r,y)),28),   // tapered, wide end on the post; counterbore underneath for its screw
  head: new THREE.CylinderGeometry(0.22,0.48,0.28,20),          // button head
  shaft:new THREE.CylinderGeometry(0.2,0.2,0.9,10),
};
function mesh(geo, mat){ const m=new THREE.Mesh(geo,mat); return m; }
const HOLE_MAT=new THREE.MeshBasicMaterial({color:0x2a2116}), HOLE_GEO=new THREE.CircleGeometry(0.17,16);
function tnutMesh(geo){ const m=mesh(geo,M.nut); const h=new THREE.Mesh(HOLE_GEO,HOLE_MAT); const o=geo.userData.out;   // the threaded hole, on the ridge
  h.position.copy(o).multiplyScalar(0.102); h.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),o); m.add(h); return m; }

function legGeo(){ // plate: x 0..2 along the leg, z -1..1 across, y 0..-BRK_T; an oval hole at x=HOLE
  const sh=new THREE.Shape([new THREE.Vector2(0,-1),new THREE.Vector2(2,-1),new THREE.Vector2(2,1),new THREE.Vector2(0,1)]);
  const r=0.27, l=0.12; const hp=new THREE.Path();
  hp.moveTo(HOLE-l, -r); hp.lineTo(HOLE+l,-r); hp.absarc(HOLE+l,0,r,-Math.PI/2,Math.PI/2,false); hp.lineTo(HOLE-l,r); hp.absarc(HOLE-l,0,r,Math.PI/2,Math.PI*1.5,false);
  sh.holes.push(hp);
  return new THREE.ExtrudeGeometry(sh,{depth:BRK_T,bevelEnabled:false}).rotateX(Math.PI/2);
}
const BRK_GEO={ leg:legGeo(),

  const w1=mesh(BRK_GEO.wall,M.dark); w1.position.z=1-BRK_W; const w2=mesh(BRK_GEO.wall,M.dark); w2.position.z=-1;
  g.add(railLeg,postLeg,w1,w2);
  for (const u of [0.3,1.8]){ const k1=mesh(BRK_GEO.key,M.dark); k1.position.set(u,0.08,0); g.add(k1);       // keys ride in the rail's slot
    const k2=mesh(BRK_GEO.key,M.dark); k2.rotation.z=Math.PI/2; k2.position.set(-0.08,-u,0); g.add(k2); }    // and in the post's slot

  const lines=text.split('\n'); let fs=lines.length>1?(lines.some(l=>l.length>8)?34:44):(aspect>1.5?110:44);
  g.font=`600 ${fs}px "IBM Plex Sans", system-ui, sans-serif`; while (Math.max(...lines.map(l=>g.measureText(l).width))>W*0.9 && fs>16){ fs-=2; g.font=`600 ${fs}px "IBM Plex Sans", system-ui, sans-serif`; }

// the sides: rolled a quarter turn at a time and slid back each time, so the frame always lies right in front of the chair (z -3.8 .. 27.7)
POSE.left  = {pos:POSE.lying.pos.clone(), quat:qMul(qAA(Z, Math.PI/2),POSE.lying.quat)};
POSE.right = {pos:POSE.lying.pos.clone(), quat:qMul(qAA(Z,-Math.PI/2),POSE.lying.quat)};
POSE.front = {pos:POSE.lying.pos.clone(), quat:qMul(qAA(Z,-Math.PI),POSE.lying.quat)};
POSE.front2 = {pos:POSE.front.pos.clone().add(new THREE.Vector3(0,0,-24.2)), quat:POSE.front.quat.clone()};  // slid back to stand it up
POSE.upFront = tipped(POSE.front2, feetEdge(POSE.front2, HALF+1), X, Math.PI/2);          // standing, the box rail facing away
POSE.__roll = {pos:new THREE.Vector3(), quat:new THREE.Quaternion()};
POSE.headTip = tipped(POSE.front, new THREE.Vector3(0,0,POSE.front.pos.z-(0.6+POST_L)), X, -Math.PI/2);   // stood on its top, the box rail on the far side
POSE.headDown = {pos:POSE.headTip.pos.clone().add(new THREE.Vector3(0,0,26)), quat:POSE.headTip.quat.clone()};   // then slid back toward you
{ const q=qMul(qAA(Z,Math.PI),POSE.headDown.quat), g=new THREE.Object3D(); g.quaternion.copy(q); g.updateMatrixWorld(true);
  const c=new THREE.Vector3(0,15.3,0); const g0=new THREE.Object3D(); g0.position.copy(POSE.headDown.pos); g0.quaternion.copy(POSE.headDown.quat); g0.updateMatrixWorld(true);
  const C=g0.localToWorld(c.clone()); C.y=15.3+FOOT_DROP; POSE.final={pos:C.clone().sub(c.clone().applyQuaternion(q)), quat:q}; }   // turned over sideways about its own centre, standing on its feet
function setPose(name){ build.position.copy(POSE[name].pos); build.quaternion.copy(POSE[name].quat); build.userData.pose=name; }

/* ghost: where the next part goes */
const ghostGroup=new THREE.Group(); scene.add(ghostGroup);
function showGhost(){ /* destinations are already outlined in red for the whole step */ }
function showGhostOld(id, homeName){
  const o=parts[id], h=o.userData.homes[homeName];
  const gm=new THREE.Mesh(o.geometry || G.nutYp, M.ghost);
  if (!o.geometry){ // group (bracket): use a box
    gm.geometry=new THREE.BoxGeometry(2.3,2.3,2);
  }
  h.parent.updateMatrixWorld(true);
  const m=new THREE.Matrix4().compose(h.pos,h.quat,new THREE.Vector3(1,1,1)).premultiply(h.parent.matrixWorld);
  m.decompose(gm.position,gm.quaternion,gm.scale); ghostGroup.add(gm);
}
function clearGhosts(){ while(ghostGroup.children.length) ghostGroup.remove(ghostGroup.children[0]); ghostGroup.userData.marks=[]; }

/* ---- the Raspberry Pi 5 and the readout board, drawn as simple solid parts in the CAD files' own coordinates (cm).
   Pi: board x 0..8.5, z -5.6..0 (GPIO header along z = -5.6), top face y = 0.292. Readout board: x 2.155..8.655, z 2.751..8.401, y 0..0.156.
   No two faces share a plane: every part stands a hair above the board it sits on. */
function mergedBoxes(list, mat){ /* list of [x0,y0,z0,x1,y1,z1] boxes -> one mesh */
  const pos=[], nor=[];
  for (const [x0,y0,z0,x1,y1,z1] of list){ const g=new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0).toNonIndexed(); g.translate((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
    pos.push(...g.attributes.position.array); nor.push(...g.attributes.normal.array); g.dispose(); }
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); geo.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  return new THREE.Mesh(geo,mat); }
function boardShape(x0,z0,x1,z1,r,holes,hr){ const s=new THREE.Shape(); s.moveTo(x0+r,z0); s.lineTo(x1-r,z0); s.quadraticCurveTo(x1,z0,x1,z0+r); s.lineTo(x1,z1-r); s.quadraticCurveTo(x1,z1,x1-r,z1);
  s.lineTo(x0+r,z1); s.quadraticCurveTo(x0,z1,x0,z1-r); s.lineTo(x0,z0+r); s.quadraticCurveTo(x0,z0,x0+r,z0);
  for (const [x,z] of holes){ const h=new THREE.Path(); h.absarc(x,z,hr,0,Math.PI*2,true); s.holes.push(h); } return s; }
function boardMesh(shape, y0, t, mat){ const g=new THREE.ExtrudeGeometry(shape,{depth:t,bevelEnabled:false,curveSegments:8}); g.rotateX(Math.PI/2); g.translate(0,y0+t,0);
  return new THREE.Mesh(g,mat); }                                          /* rotating about x puts the outline's second coordinate on +z: (x, z) stays (x, z) */
const BM={
  pcbPi:new THREE.MeshStandardMaterial({color:0x1d6b3a, roughness:.65}),
  pcbRo:new THREE.MeshStandardMaterial({color:0x1a4f3a, roughness:.65}),
  metal:new THREE.MeshStandardMaterial({color:0xc4c9ce, roughness:.35, metalness:.6}),
  chip:new THREE.MeshStandardMaterial({color:0x1a1b1d, roughness:.55}),
  plastic:new THREE.MeshStandardMaterial({color:0x111214, roughness:.6}),
  usb3:new THREE.MeshStandardMaterial({color:0x2a62c9, roughness:.5}),
  beige:new THREE.MeshStandardMaterial({color:0xe2d6b8, roughness:.6}),
  gold:new THREE.MeshStandardMaterial({color:0xd4b25c, roughness:.35, metalness:.6}),
  white:new THREE.MeshStandardMaterial({color:0xeeeeea, roughness:.6}),
  led:new THREE.MeshStandardMaterial({color:0xffd27a, roughness:.4, emissive:0x553300}),
};
function piModel(){ const g=new THREE.Group(), T=0.292, e=0.002;
  g.add(boardMesh(boardShape(0,-5.6,8.5,0,0.3,[[0.35,-0.35],[0.35,-5.25],[6.15,-0.35],[6.15,-5.25]],0.135),0.132,0.16,BM.pcbPi));
  /* GPIO header: base and 40 pins */
  g.add(mergedBoxes([[0.71,T+e,-5.55,5.79,T+0.25,-5.04]],BM.plastic));
  const pins=[]; for (let k=0;k<20;k++) for (const z of [-5.422,-5.168]){ const x=0.87+k*0.254; pins.push([x-0.032,T+0.25,z-0.032,x+0.032,T+0.85,z+0.032]); } g.add(mergedBoxes(pins,BM.gold));
  /* processor, memory, south bridge, power chip */
  g.add(mergedBoxes([[2.2,T+e,-4.05,3.7,T+0.24,-2.55]],BM.metal));
  g.add(mergedBoxes([[4.25,T+e,-4.15,5.55,T+0.12,-2.95],[5.35,T+e,-2.55,6.25,T+0.1,-1.65],[1.0,T+e,-3.6,1.6,T+0.09,-3.0]],BM.chip));
  /* network socket and the two pairs of USB sockets, along the x = 8.5 end */
  g.add(mergedBoxes([[6.6,T+e,-1.82,8.8,T+1.36,-0.22],[6.95,T+e,-3.62,8.75,T+1.6,-2.28],[6.95,T+e,-5.42,8.75,T+1.6,-4.08]],BM.metal));
  g.add(mergedBoxes([[8.805,T+0.25,-1.58,8.82,T+1.12,-0.46]],BM.plastic));
  g.add(mergedBoxes([[8.755,T+0.22,-3.5,8.77,T+0.68,-2.4],[8.755,T+0.98,-3.5,8.77,T+1.44,-2.4]],BM.usb3));
  g.add(mergedBoxes([[8.755,T+0.22,-5.3,8.77,T+0.68,-4.2],[8.755,T+0.98,-5.3,8.77,T+1.44,-4.2]],BM.plastic));
  /* power (USB-C) and the two micro-HDMI sockets on the z = 0 edge, camera/display connectors, fan header */
  g.add(mergedBoxes([[0.75,T+e,-0.62,1.49,T+0.32,0.08],[2.25,T+e,-0.56,2.9,T+0.3,0.06],[3.6,T+e,-0.56,4.25,T+0.3,0.06]],BM.metal));
  g.add(mergedBoxes([[4.75,T+e,-1.15,5.05,T+0.55,-0.25],[5.4,T+e,-1.15,5.7,T+0.55,-0.25]],BM.beige));
  g.add(mergedBoxes([[7.3,T+e,-4.0,7.8,T+0.35,-3.75]],BM.white));
  return g; }
const SMA_X=[3.201,4.701,6.161,7.521];
function hatModel(){ const g=new THREE.Group(), T=0.156, e=0.002;
  g.add(boardMesh(boardShape(2.155,2.751,8.655,8.401,0.3,[[2.505,3.101],[8.305,3.101],[2.505,8.001],[8.305,8.001]],0.135),0,0.156,BM.pcbRo));
  /* the 40-way socket underneath, and its pin ends through the board */
  g.add(mergedBoxes([[2.865,-0.85,2.897,7.945,-e,3.405]],BM.plastic));
  const tails=[]; for (let k=0;k<20;k++) for (const z of [3.024,3.278]){ const x=2.992+k*0.254; tails.push([x-0.03,T+e,z-0.03,x+0.03,T+0.16,z+0.03]); } g.add(mergedBoxes(tails,BM.gold));
  /* chips, the three indicator lights, the power module */
  g.add(mergedBoxes([[4.6,T+e,4.6,6.2,T+0.14,6.2],[3.0,T+e,4.3,3.9,T+0.12,5.0],[6.7,T+e,4.4,7.5,T+0.12,5.1],[3.0,T+e,6.0,3.7,T+0.1,6.6]],BM.chip));
  g.add(mergedBoxes([[7.9,T+e,3.9,8.3,T+0.45,5.1]],BM.plastic));
  const leds=[0,1,2].map(k=>[6.9+k*0.35,T+e,3.75,7.06+k*0.35,T+0.08,3.95]); g.add(mergedBoxes(leds,BM.led));
  /* four edge SMA sockets: flange on the board edge, hex body, threaded barrel */
  for (const x of SMA_X){ const y=0.29;
    g.add(mergedBoxes([[x-0.32,e,7.95,x+0.32,0.6,8.4]],BM.gold));
    const hex=new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.36,0.3,6),BM.gold); hex.rotation.x=Math.PI/2; hex.position.set(x,y,8.56); g.add(hex);
    const bar=new THREE.Mesh(new THREE.CylinderGeometry(0.31,0.31,0.42,16),BM.gold); bar.rotation.x=Math.PI/2; bar.position.set(x,y,8.91); g.add(bar);
    const pin=new THREE.Mesh(new THREE.CircleGeometry(0.2,14),BM.plastic); pin.position.set(x,y,9.125); g.add(pin); }
  return g; }

const GAL={ el:document.getElementById('gallery'), wall:document.querySelector('#gallery .wall'), key:'', timer:0, sq:[], shown:[], next:0 };
GAL.el.addEventListener('pointerdown', e=>e.stopPropagation()); GAL.el.addEventListener('click', e=>e.stopPropagation());   /* clicks here do not reach the bench behind */
GAL.el.querySelector('.send').innerHTML=`Take a photo of your detector and send it to ${GALLERY_SEND_TO}: <b>${GALLERY_EMAIL}</b>`;
function galImg(src){ const im=new Image(); im.src=src; im.alt='A gLOWCOST detector'; im.draggable=false; return im; }
function galFill(){ GAL.wall.innerHTML=''; GAL.shown=[];
  const wide=GALLERY_PHOTOS.find(p=>p.wide), sq=GALLERY_PHOTOS.filter(p=>p!==wide).map(p=>p.src); GAL.sq=sq;
  if (wide){ const d=document.createElement('div'); d.className='wide'; d.appendChild(galImg(wide.src)); GAL.wall.appendChild(d); }
  const n=Math.min(sq.length, isPhone()?2:4);                                      /* a phone has room for the wide photo and two squares in one row */
  for (let i=0;i<n;i++){ const d=document.createElement('div'); d.appendChild(galImg(sq[i])); GAL.wall.appendChild(d); GAL.shown.push(sq[i]); }
  GAL.next=n; }
function galCycle(){ /* when there are more square photos than squares, one changes every few seconds */
  if (GAL.el.hidden || GAL.sq.length<=GAL.shown.length) return;
  const slot=Math.floor(Math.random()*GAL.shown.length), d=GAL.wall.querySelectorAll('div:not(.wide)')[slot], im=d&&d.querySelector('img:last-child'); if (!im) return;
  let src=GAL.sq[GAL.next%GAL.sq.length]; GAL.next++; let guard=0; while (GAL.shown.includes(src) && guard++<GAL.sq.length){ src=GAL.sq[GAL.next%GAL.sq.length]; GAL.next++; }
  GAL.shown[slot]=src; const n=galImg(src); n.style.opacity=0;
  n.onload=()=>{ d.appendChild(n); requestAnimationFrame(()=>requestAnimationFrame(()=>{ n.style.opacity=1; setTimeout(()=>im.remove(),700); })); }; }
function galleryTick(){
  const on=!!(STEPS[cur] && STEPS[cur].gallery) && !reversing;
  if (GAL.el.hidden===on){ GAL.el.hidden=!on; clearInterval(GAL.timer); if (on){ GAL.key=''; GAL.timer=setInterval(galCycle,3500); } }
  if (!on) return;
  const W=renderer.domElement.clientWidth, H=renderer.domElement.clientHeight, r=cam2Rect(W,H,true), ph=isPhone(), key=[W,H,r.x,r.y,r.w,r.h,ph].join();
  if (key===GAL.key) return; GAL.key=key;
  if (!GAL.wall.children.length || GAL.wall.dataset.phone!==String(ph)){ galFill(); GAL.wall.dataset.phone=String(ph); }
  let w=r.w;
  if (!ph){ /* as wide as the column allows, but no taller than the space Cam 2 would use: the wall is 1.5625 times its inner width tall */
    const chrome=GAL.el.offsetHeight-GAL.wall.offsetHeight; w=Math.min(r.w, Math.floor((r.h-chrome-6)/1.5625)+20); }
  Object.assign(GAL.el.style,{left:(r.x+r.w-w)+'px', bottom:(ph ? r.y+r.h : r.y)+'px', width:w+'px', height:'auto', transform:ph?'translateY(100%)':''}); }

function decodeModel(m, matFor){
  const g=new THREE.Group();
  const b64=s=>{ const bin=atob(s), u=new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u.buffer; };
  for (const grp of m.g){
    const q=new Int16Array(b64(grp.v)), pos=new Float32Array(q.length);
    for (let i=0;i<q.length;i+=3){ pos[i]=m.lo[0]+(q[i]+32500)*m.s; pos[i+1]=m.lo[1]+(q[i+1]+32500)*m.s; pos[i+2]=m.lo[2]+(q[i+2]+32500)*m.s; }
    const idx= grp.i32 ? new Uint32Array(b64(grp.i)) : new Uint16Array(b64(grp.i));
    let geo=new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos,3)); geo.setIndex(new THREE.BufferAttribute(idx,1));
    geo=geo.toNonIndexed(); geo.computeVertexNormals();
    const mat = matFor ? matFor(grp) : new THREE.MeshStandardMaterial({color:new THREE.Color(...grp.c), roughness:.6, metalness:.1, side:THREE.DoubleSide});
    g.add(new THREE.Mesh(geo,mat)); }
  return g; }

function cam2Rect(W,H,compare=false){

    const w=W-32, h=Math.round(Math.min(w*0.5, H*0.24)); return {x:16, y:H-top-h, w, h}; }
  if (compare && W>=700){ const pw=Math.round(Math.min(W*0.22, (H-70-44-12)/2/0.95, 400)), ph=Math.round(pw*0.95); return {x:W-pw-16, y:70, w:pw, h:ph*2+12, pw, ph, stack:true}; }   // right/wrong: stacked in a narrow column, the build keeps the rest
  if (compare){ const pw=Math.round((W-44)/2), ph=Math.round(pw*1.15); return {x:16, y:70, w:pw*2+12, h:ph, pw, ph, stack:false}; }                                    // phone: side by side under the build
  const w=Math.round(Math.min(560, W*0.4, H*0.5/0.62)), h=Math.round(w*0.62); return {x:W-w-16, y:70, w, h}; }   // bottom-right, above the bar (y from the bottom)
function fit(ids, dirName='chair', pad=1.25, withCam2=false){
  const box=new THREE.Box3(); let sph=null;
  for (const id of ids){
    if (typeof id==='object' && id.box){ box.union(new THREE.Box3(new THREE.Vector3(...id.box[0]), new THREE.Vector3(...id.box[1]))); continue; }
    if (typeof id==='object'){ // point focus: {local:[x,y,z]} in frame coordinates, or {world:[x,y,z]}, with radius r
      const c = id.local ? build.localToWorld(new THREE.Vector3(...id.local)) : new THREE.Vector3(...id.world);
      sph=new THREE.Sphere(c, id.r||10); continue; }
    const o= id==='tray'? null : (parts[id]||(id==='build'?build:null)); if (o) box.expandByObject(o);
  }
  if (ids.includes('tray')) box.union(new THREE.Box3(new THREE.Vector3(-42,0,-31), new THREE.Vector3(42,8,31)));
  if (ids.includes('bench')) box.union(new THREE.Box3(new THREE.Vector3(-80,0,-62), new THREE.Vector3(80,20,40)));
  if (!sph) sph=box.getBoundingSphere(new THREE.Sphere());

  const dir=new THREE.Vector3(...DIR[dirName]); if (isPhone()) dir.y+=0.45; dir.normalize();     // an upright screen is narrow: look down a little more, so depth fills its height
  const vfov=camera.fov*Math.PI/180; const hfov=2*Math.atan(Math.tan(vfov/2)*camera.aspect);
  let dist=sph.radius*pad/Math.sin(Math.min(vfov,hfov)/2)*0.6;
  // push the camera back until all eight box corners sit inside the view, clear of the text bands
  const tc=camera.clone(); const corners=[]; for (const x of [box.min.x,box.max.x]) for (const y of [box.min.y,box.max.y]) for (const z of [box.min.z,box.max.z]) corners.push(new THREE.Vector3(x,y,z));
  const W=renderer.domElement.clientWidth||innerWidth, H=renderer.domElement.clientHeight||innerHeight;
  const pr=document.getElementById('stepBox').getBoundingClientRect(), bb=document.getElementById('bottom').getBoundingClientRect();
  let pX=(pr.right+12)/W*2-1, pY=1-(pr.bottom+12)/H*2, yMin=1-(bb.top-14)/H*2;     // the panel's corner and the bar's top, in view coordinates
  // with Cam 2 on screen the build keeps to the part of the view left of it: the camera slides sideways so the build sits centred there
  const cr = withCam2 ? cam2Rect(W,H,withCam2==='compare') : null, phone=isPhone(), narrow = !phone && cr && cr.w > W*0.6;      // narrow window: the insets span the width, keep the build above them
  let xMax = cr && !narrow && !phone ? (cr.x-14)/W*2-1 : 0.92, yMin2 = narrow ? Math.max(yMin, 1-(H-cr.y-cr.h-12)/H*2) : yMin, yMax=0.92, yMid=0;

  let xMid=(xMax-0.92)/2; const tanH=Math.tan(hfov/2), tanV=Math.tan(vfov/2);
  const shiftAt=d=>new THREE.Vector3(1,0,0).applyQuaternion(tc.quaternion).multiplyScalar(-xMid*d*tanH).add(new THREE.Vector3(0,1,0).applyQuaternion(tc.quaternion).multiplyScalar(-yMid*d*tanV));
  const okAt=d=>{ tc.position.copy(sph.center).addScaledVector(dir,d); tc.lookAt(sph.center); tc.position.add(shiftAt(d)); tc.updateMatrixWorld(true);
    return corners.every(c=>{ const q=c.clone().project(tc); return q.x>=-0.92 && q.x<=xMax && q.y>=yMin2 && q.y<=yMax && q.z<1 && !(q.x<pX && q.y>pY); }); };
  const d0=dist; for (let n=0;n<80 && !okAt(dist);n++) dist*=1.06;
  if (!phone && pX>-0.6 && xMax-pX>0.45){ // a tall step panel: try centring the work in the space to the right of it instead, and keep that if it brings the camera clearly closer
    const xm0=xMid; xMid=(pX+xMax)/2-0.0; let d2=d0; for (let n=0;n<80 && !okAt(d2);n++) d2*=1.06;
    if (d2<dist*0.88) dist=d2; else xMid=xm0; }
  if (parts.mag && parts.mag.visible && parts.mag.userData.home==='storage' && (ids.includes('tray')||ids.includes('bench'))){ // a wide view keeps the magnifier on screen too, unless that would push the camera far back
    const mb=new THREE.Box3().setFromObject(parts.mag), c0=corners.length; for (const x of [mb.min.x,mb.max.x]) for (const y of [mb.min.y,mb.max.y]) for (const z of [mb.min.z,mb.max.z]) corners.push(new THREE.Vector3(x,y,z));
    let d2=dist; for (let n=0;n<40 && !okAt(d2);n++) d2*=1.06; if (d2<=dist*1.35) dist=d2; else corners.length=c0; }
  dist*=Math.max(1, pad);
  tc.position.copy(sph.center).addScaledVector(dir,dist); tc.lookAt(sph.center); const sh=shiftAt(dist);
  return {pos:sph.center.clone().addScaledVector(dir,dist).add(sh), tgt:sph.center.clone().add(sh)};
}
function flyTo(target, instant){
  if (instant){ camState.pos.copy(target.pos); camState.tgt.copy(target.tgt); return; }
  const p0=camState.pos.clone(), t0=camState.tgt.clone();
  return tween(1400, t=>{ camState.pos.lerpVectors(p0,target.pos,t); camState.tgt.lerpVectors(t0,target.tgt,t); }, 'cam');
}

async function standPost(p,i){
  const id='post'+p, o=parts[id], h=o.userData.homes.build;
  const slides=[{id:`p${p}x1`,to:[NUT_D,NUT_H[0]-1,0]},{id:`p${p}z1`,to:[0,NUT_H[0]-1,NUT_D]},{id:`p${p}x2`,to:[NUT_D,NUT_H[0]-2,0]},{id:`p${p}z2`,to:[0,NUT_H[0]-2,NUT_D]}];

  const [sx,sz]=CORNERS[p]; const out=new THREE.Vector3(sx,0,sz).applyQuaternion(build.quaternion); out.y=0; out.normalize();
  // choose where to hold it level and turn it head-down: beside the corner, foot pointing somewhere with nothing in the way
  scene.attach(o); const ps=o.position.clone(), qs=o.quaternion.clone();

  else { if (BAKED) console.warn('stand-up not recorded:', sk);
  const pr=probesOf(o), obs=obstacles(o), own=[new THREE.Vector3(-1,0,-1),new THREE.Vector3(1,POST_L,1)];
  const fin=new Set(); for (const ob of obs){ const c=clearance(pr,p1,q1,[ob],null,own); if (c<0.2) fin.add(ob.o); }
  const view=camState.tgt.clone().sub(camState.pos); view.y=0; view.normalize();
  const dirs=[out, new THREE.Vector3(Math.sign(out.x),0,0), new THREE.Vector3(0,0,Math.sign(out.z)), new THREE.Vector3(-out.z,0,out.x), new THREE.Vector3(out.z,0,-out.x)]
    .sort((a,b)=>Math.abs(a.dot(view))-Math.abs(b.dot(view)));
  search: for (const H of [5,8,12,16]) for (const d of dirs){
    const hh=H1.clone().addScaledVector(out,6).add(new THREE.Vector3(0,H,0)); const kk=new THREE.Vector3().crossVectors(Y,d).normalize(); const ql=qMul(qAA(kk,Math.PI/2),q1);

    for (let j=0;j<=8;j++){ worst=Math.min(worst, clearance(pr,pose(q1,hh.clone().lerp(above,j/8)),q1,obs,null,own)); }
    for (let j=0;j<=10;j++){ const hd=above.clone().lerp(H1,j/10); worst=Math.min(worst, clearance(pr,pose(q1,hd),q1,obs, hd.y-H1.y<2.5?fin:null,own)); }

  const rmCaps=addCaps(o); const lab=addLabel(CAREFUL,'fly',o,[0,3,0]);
  const plan=planCarry(o,ps,qs,pL,qL,{minLift:3}); o.userData.phase='carry (standPost) c='+plan.clear.toFixed(2); await tween((700+plan.len*22)*1.6, t=>plan.at(t)); o.userData.phase='standPost tip';
  lab.el.textContent='head down, never foot down: the T-nuts slide to the bracket'; await wait(500);
  const sa=slides.map(sl=>({o:parts[sl.id], from:parts[sl.id].position.clone(), to:new THREE.Vector3(...sl.to)}));

/* ============================== detector steps ============================== */
/* poses: from standing (final) onto its head, down onto its front (box rails up), and back up */
async function flipToHead(i){ /* lift it and turn it over sideways, the reverse of the frame's last turn */
  if (i){ setPose('headDown'); settleNuts(true); return; }
  const q0=build.quaternion.clone(), c=new THREE.Vector3(0,15.3,0), C0=build.localToWorld(c.clone()), C1=POSE.headDown.pos.clone().add(c.clone().applyQuaternion(POSE.headDown.quat));
  const corners=[]; for (const x of [-12.16,12.16]) for (const y of [-FOOT_DROP,0.6+POST_L]) for (const z of [-12.16,12.16]) corners.push(new THREE.Vector3(x,y,z).sub(c));
  await tween(3600, t=>{ const q=qMul(qAA(Z,-Math.PI*t),q0); const C=C0.clone().lerp(C1,t); let lo=Infinity; for (const k of corners) lo=Math.min(lo, C.y+k.clone().applyQuaternion(q).y);
    if (lo<0.4) C.y+=0.4-lo; build.quaternion.copy(q); build.position.copy(C).sub(c.clone().applyQuaternion(q)); });
  setPose('headDown'); await settleNuts(false); }
async function layOnFront(i){ /* slide it away, then lower it toward you onto its front: the box rails end up on top */
  if (i){ setPose('front'); settleNuts(true); return; }
  await slideBuild('headTip',{dur:1800}); await wait(300);
  await tipBuild('front', new THREE.Vector3(0,0,POSE.front.pos.z-TOP_Y), X, Math.PI/2, {dur:3400}); }
POSE.detUp = (()=>{ const u=POSE.upFront, f=POSE.final; const c=new THREE.Vector3(0,15.3,0);
  const cf=f.pos.clone().add(c.clone().applyQuaternion(f.quat)); const p=cf.sub(c.clone().applyQuaternion(u.quat)); p.y=u.pos.y; return {pos:p, quat:u.quat.clone()}; })();
async function standUp(i){ /* from its front: slide it away, lift the far end up onto the feet, slide it back */
  if (i){ setPose('detUp'); settleNuts(true); return; }
  await slideBuild('front2',{dur:1800}); await wait(300);
  await tipBuild('upFront', feetEdge(POSE.front2, HALF+1), X, Math.PI/2, {dur:3400}); await wait(300); await slideBuild('detUp',{dur:1800}); }

/* directions in the frame's own coordinates */
const upLocal=()=>{ build.updateMatrixWorld(true); return new THREE.Vector3(0,1,0).applyQuaternion(build.quaternion.clone().invert()); };
const nearLocal=()=>{ build.updateMatrixWorld(true); return new THREE.Vector3(0,0,1).applyQuaternion(build.quaternion.clone().invert()); };
function tempHome(id, name, pos, quat){ parts[id].userData.homes[name]={parent:build, pos:pos.clone(), quat:(quat||new THREE.Quaternion()).clone()}; }

/* a flat part goes in: from above on the open top level, or through the side opening nearest you, held square, then turned and lowered */
async function fitFlat(id, {via='top', turn=0, lift=0.8, label=null, instant=false}={}){
  if (instant){ place(id,'on'); return; }
  const o=parts[id], h=o.userData.homes.on, up=upLocal(), near=nearLocal();
  const qTurn=qMul(h.quat, qAA(Y,-turn));                                    /* held square to the opening, turned to its place on the rails */
  if (via==='top'){
    tempHome(id,'__above', h.pos.clone().addScaledVector(up,2.4), qTurn);
    await moveTo(id,'__above',{label, lift:4}); scene.attach(o);           /* the rest of the way in table coordinates */
  } else {
    tempHome(id,'__out', h.pos.clone().addScaledVector(up,lift).addScaledVector(near,25), qTurn);
    await moveTo(id,'__out',{label, lift:3}); scene.attach(o);
    const a=o.position.clone(), b=build.localToWorld(h.pos.clone().addScaledVector(up,lift));
    await tween(1500, t=>o.position.lerpVectors(a,b,t));
  }
  if (turn){ const q0=o.quaternion.clone(), qe=worldOf(h.parent,h.pos,h.quat).q; await wait(150); await tween(900, t=>THREE.Quaternion.slerp(q0,qe,o.quaternion,t)); }
  const a=o.position.clone(), b=worldOf(h.parent,h.pos,h.quat).p; await tween(via==='top'?700:600, t=>o.position.lerpVectors(a,b,t));

/* the turn a sheet makes on the rails, drawn flat over its level, with its angle */
function turnArrow(L, u, angle){ build.updateMatrixWorld(true); const Yc=sheetY(L,u)+(u?0.5:-0.5);
  const c=build.localToWorld(new THREE.Vector3(0,Yc,0)), ax=new THREE.Vector3(1,0,0).transformDirection(build.matrixWorld), az=new THREE.Vector3(0,0,1).transformDirection(build.matrixWorld);
  const r=7.2, n=28, pts=[]; for (let i=0;i<=n;i++){ const b=Math.PI*0.25+angle*i/n; pts.push(c.clone().addScaledVector(ax,r*Math.cos(b)).addScaledVector(az,-r*Math.sin(b))); }
  const tube=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),40,0.12,6,false),ARROW_MAT); tube.renderOrder=999; markGroup.add(tube);
  const tip=pts[n], dir=tip.clone().sub(pts[n-1]).normalize(); const cone=new THREE.Mesh(new THREE.ConeGeometry(0.42,0.95,12),ARROW_MAT); cone.renderOrder=999;
  cone.position.copy(tip).addScaledVector(dir,0.35); cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir); markGroup.add(cone);
  addLabel(Math.round(Math.abs(angle)*180/Math.PI)+'°','deg',pts[Math.round(n/2)].clone().add(pts[Math.round(n/2)].clone().sub(c).normalize().multiplyScalar(1.6))); }

/* T-nuts slide inside their groove to a spot along the rail */
async function slideNutTo(id, x, {instant=false, delay=0}={}){ const n=parts[id]; const p=n.position.clone(); p.x=x;
  if (instant || Math.abs(n.position.x-x)<0.05){ n.position.copy(p); return; } await slideLocal(id, p.toArray(), {delay, dur:500+60*Math.abs(n.position.x-x)}); }
const sheetNuts=(L,u)=>[3,2,1,0].map(s=>railMidNut(railAt(L,s),!!u));                /* right, left, front, back: the order of SHEET_TIPS */
async function midNuts(L,u,i){ await par(...sheetNuts(L,u).map((id,k)=>slideNutTo(id,0,{instant:i,delay:k*120}))); }

/* sheet screws: the key, as for the brackets */
const sheetScrews=(L,u)=>[0,1,2,3].map(k=>`ss${L}${u?'u':'l'}${k}`);
async function screwSheet(L,u,i,{fast=false}={}){ const ids=sheetScrews(L,u); ids.forEach(id=>place(id,'loaded'));
  if (i){ ids.forEach(id=>parts[id].visible=true); return; }
  for (let k=0;k<4;k++){ TSCALE= fast? 0.35 : (k>=2?0.5:1); await driveScrew(parts[ids[k]],{quick:fast||k>0, first:k===0, last:k===3}); } TSCALE=1; }

/* Pi screws: the screwdriver straight down the screw's axis, a few turns, back out */
async function driveSmall(id,{instant=false, first=false, last=false, quick=false}={}){
  place(id,'loaded'); const sc=parts[id]; if (instant){ sc.visible=true; return; }
  const sd=parts.sdrv; sc.updateMatrixWorld(true); const p1=sc.getWorldPosition(new THREE.Vector3()), qs=sc.getWorldQuaternion(new THREE.Quaternion());
  const ax=new THREE.Vector3(0,1,0).applyQuaternion(qs);                       /* into the post */
  const qTool=qMul(qs,qAA(X,Math.PI)); const tipAt=d=>p1.clone().addScaledVector(ax,-0.21-d);
  scene.attach(sd); sd.userData.phase='travel'; const plan=planCarry(sd, sd.position.clone(), sd.quaternion.clone(), tipAt(2.5), qTool, {minLift:3});
  await tween((quick?260:480)+plan.len*(quick?6:9), t=>plan.at(t));
  sc.visible=true; const s0=p1.clone().addScaledVector(ax,-0.5); sc.position.copy(sc.parent.worldToLocal(s0.clone()));
  sd.userData.phase='down'; const a=sd.position.clone(); await tween(quick?200:380, t=>sd.position.lerpVectors(a,tipAt(0.5),t));
  sd.userData.phase='turning'; const turns=quick?2:3; await tween((quick?260:420)*turns, t=>{ const d=0.5*(1-t); sd.position.copy(tipAt(d)); sd.quaternion.copy(qMul(qTool,qAA(Y,-Math.PI*2*turns*t)));
    sc.position.copy(sc.parent.worldToLocal(p1.clone().addScaledVector(ax,-d))); sc.quaternion.copy(qMul(sc.parent.getWorldQuaternion(new THREE.Quaternion()).invert(),qs,qAA(Y,Math.PI*2*turns*t))); });
  place(id,'loaded'); sc.visible=true;
  sd.userData.phase='up'; const b=sd.position.clone(); await tween(220, t=>sd.position.lerpVectors(b,tipAt(2.5),t));
  if (last) await moveTo('sdrv','storage',{dur:500}); }

/* the lid swings on its hinge */
async function swingLid(to, i){ const o=parts.boxLid; if (i){ place('boxLid',to); return; }
  const a0= o.userData.home==='closed'?Math.PI:0, a1= to==='closed'?Math.PI:0; await tween(1300, t=>o.quaternion.copy(qAA(X,a0+(a1-a0)*t))); place('boxLid',to); }

/* a tile unit goes in with its coil on top, then the coil goes out over the right-hand rail onto the table */
async function fitTile(L, via, i, lift=1.9){
  const id='tile'+L;
  if (i){ place(id,'on'); place('cl'+L,'table'); return; }
  await fitFlat(id,{via, lift, label:'tile unit · hold the edges'}); await wait(250);
  const cl=parts['cl'+L], Y=LEVEL_Y[L]; scene.attach(cl);
  const wp=[cl.position.clone(), ...[[3.2,Y+3.4,-3.2],[9.0,Y+3.4,-4.6],[14.2,Y+3.4,-5.4],[16.8,Math.max(-FOOT_DROP+0.13,Y+3.4-8),-13.5]].map(v=>build.localToWorld(new THREE.Vector3(...v))), worldOf(build,cl.userData.homes.table.pos,cl.userData.homes.table.quat).p];
  const q0=cl.quaternion.clone(), q1=worldOf(build,cl.userData.homes.table.pos,cl.userData.homes.table.quat).q;
  const lab=addLabel('lead coil','fly',cl,[0,2,0]);
  const len=wp.reduce((s,p,k)=>k?s+p.distanceTo(wp[k-1]):0,0); let acc=[0]; for (let k=1;k<wp.length;k++) acc.push(acc[k-1]+wp[k].distanceTo(wp[k-1]));
  await tween(900+len*45, t=>{ const s=t*len; let k=1; while (k<wp.length-1 && acc[k]<s) k++; const u=(s-acc[k-1])/((acc[k]-acc[k-1])||1); cl.position.lerpVectors(wp[k-1],wp[k],Math.min(1,u)); THREE.Quaternion.slerp(q0,q1,cl.quaternion,t); });
  removeLabel(lab); place('cl'+L,'table'); }

  const lab=addLabel('input '+(L+1),'dim',build.localToWorld(baseToBuild(-4.6,SMA_Y[L],2.04)));
  await tween(3200, t=>{ lr.position.x=t; }); lr.position.x=1; await wait(250); removeLabel(lab); }
